name: Master Audit & Verification

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Registry
        run: npm run verify
        continue-on-error: true

      - name: Verify Content Word Counts & Duplications
        run: npm run verify:content
        continue-on-error: true

      - name: Check Engine Constraints
        run: npm run verify:engine
        continue-on-error: true

      - name: Who requires image-size (Dependency Audit Debug)
        if: always()
        continue-on-error: true
        run: npm ls image-size

      - name: Run npm audit (Informational)
        if: always()
        continue-on-error: true
        run: npm audit
